<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tradutor Bíblico</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#262624;--side:#1f1e1d;--panel:#30302e;--line:#3d3d3a;--txt:#ece9e1;--mut:#9c9a92;--gold:#d4a94a;--hov:#2e2d2b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{display:flex;height:100%}
.cruz{width:1em;height:1em;display:inline-block;vertical-align:-.12em}
/* barra lateral */
.side{width:272px;background:var(--side);display:flex;flex-direction:column;padding:12px 8px 8px;overflow:hidden;flex-shrink:0}
.brand{display:flex;align-items:center;gap:9px;padding:6px 10px 12px;font-family:Georgia,"Times New Roman",serif;font-size:21px;color:var(--txt)}
.brand .cruz{font-size:22px;color:var(--gold)}
.nav{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border-radius:8px;text-align:left;color:#d9d6cd}
.nav:hover,.nav.on{background:var(--hov)}
.nav svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;flex-shrink:0}
.scroll{flex:1;overflow-y:auto;margin-top:10px;padding-right:2px}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:#3a3937;border-radius:3px}
.sec{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12px;padding:12px 10px 6px;cursor:pointer;user-select:none}
.sec i{font-style:normal;font-size:9px;transition:transform .15s}
.sec.fechado i{transform:rotate(-90deg)}
.conv{position:relative;display:flex;align-items:center;border-radius:8px;cursor:pointer}
.conv:hover,.conv.on{background:var(--hov)}
.conv .t{flex:1;padding:7px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d9d6cd}
.conv .m{display:none;padding:4px 8px;color:var(--mut);font-size:16px;line-height:1}
.conv:hover .m{display:block}
.vazio-l{padding:6px 10px;color:var(--mut);font-size:12.5px;line-height:1.5}
.menu{position:absolute;right:6px;top:30px;background:#2b2a28;border:1px solid var(--line);border-radius:10px;padding:4px;z-index:30;min-width:150px;box-shadow:0 8px 24px #0006}
.menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:7px}
.menu button:hover{background:#3a3937}
.menu .r{color:#e08a7a}
.rodape{border-top:1px solid #2c2b29;padding-top:6px;margin-top:6px}
/* principal */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;flex-shrink:0}
.top .tt{font-size:14px;color:#d9d6cd}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.pill.ok{color:#8fd19e;border-color:#3f6b4a}
.stage{flex:1;display:flex;flex-direction:column;min-height:0}
.chat{flex:1;overflow-y:auto;padding:6px 0 18px}
.col{max-width:760px;margin:0 auto;padding:0 22px}
.u{display:flex;justify-content:flex-end;margin:18px 0}
.u div{background:#1c1b1a;border-radius:14px;padding:10px 16px;max-width:82%;white-space:pre-wrap;line-height:1.5}
.a{margin:18px 0;font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.65;white-space:pre-wrap}
.a.pens{color:var(--mut);font-style:italic}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-family:-apple-system,"Segoe UI",sans-serif}
.files a{background:var(--panel);border:1px solid var(--line);color:var(--txt);text-decoration:none;padding:8px 12px;border-radius:10px;font-size:13px}
.files a:hover{border-color:var(--gold)}
.ola{display:none;text-align:center;font-family:Georgia,serif;font-size:34px;margin-bottom:22px}
.ola .cruz{font-size:30px;color:var(--gold);margin-right:10px}
.main.vazio .chat{display:none}
.main.vazio .stage{justify-content:center;padding-bottom:12vh}
.main.vazio .ola{display:block}
.box{padding:0 22px 12px}
.inp{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 14px 10px}
.inp:focus-within{border-color:#58564f}
textarea{width:100%;background:transparent;border:0;outline:0;color:var(--txt);font:inherit;font-size:16px;resize:none;max-height:180px;line-height:1.5;display:block}
.linha{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:6px;position:relative}
.modelo{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;color:#d9d6cd}
.modelo:hover{background:#3a3937}
.modelo small{color:var(--mut)}
.send{background:var(--gold);color:#1b1a18;border-radius:9px;width:32px;height:32px;font-size:17px;font-weight:700}
.send:disabled{opacity:.4;cursor:default}
.pop{position:absolute;right:42px;bottom:42px;width:340px;background:#2b2a28;border:1px solid var(--line);border-radius:14px;padding:6px;z-index:40;box-shadow:0 10px 30px #0007}
.op{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:9px}
.op:hover:not(.off){background:#3a3937}
.op.off{opacity:.5;cursor:not-allowed}
.op b{display:block;font-weight:600}
.op span{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.op.sel{outline:1px solid var(--gold)}
.tag{float:right;font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut);margin-left:8px}
.tag.ap{color:#8fd19e;border-color:#3f6b4a}.tag.in{color:var(--gold);border-color:#6b5a2e}.tag.te{color:#9fb7e8;border-color:#3e4f73}
.nota{text-align:center;color:var(--mut);font-size:12px;padding:8px 0 0}
.main.vazio .nota{display:none}
/* paineis */
.painel{display:none;flex:1;overflow-y:auto;padding:10px 0 30px}
.main.pn .stage{display:none}.main.pn .painel{display:block}
.painel h1{font-family:Georgia,serif;font-weight:400;font-size:30px;margin:10px 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.card b{font-weight:600}.card span{color:var(--mut)}
.card .acoes{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);border-radius:9px;padding:7px 12px;background:#2b2a28}
.btn:hover{border-color:var(--gold)}
.lin{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #353432}
.lin span{color:var(--mut)}
/* busca e config */
.veu{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;padding-top:12vh;z-index:50}
.veu.on{display:flex}
.cx{width:min(560px,92vw);background:#2b2a28;border:1px solid var(--line);border-radius:16px;padding:14px;max-height:70vh;overflow-y:auto}
.cx input[type=text],.cx input[type=number]{width:100%;background:#1f1e1d;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--txt);font:inherit;outline:0}
.res{padding:9px 10px;border-radius:8px;cursor:pointer}.res:hover{background:#3a3937}.res span{display:block;color:var(--mut);font-size:12.5px}
.cx h2{font-family:Georgia,serif;font-weight:400;margin:4px 0 12px}
.cx label{display:block;color:var(--mut);margin:12px 0 5px}
@media(max-width:760px){.side{display:none}}
</style>
</head>
<body>
<svg style="display:none"><symbol id="cz" viewBox="0 0 100 100"><g fill="currentColor"><rect x="42" y="12" width="16" height="76"/><rect x="12" y="42" width="76" height="16"/><rect x="30" y="6" width="40" height="10"/><rect x="30" y="84" width="40" height="10"/><rect x="6" y="30" width="10" height="40"/><rect x="84" y="30" width="10" height="40"/><rect x="20" y="24.5" width="14" height="5"/><rect x="24.5" y="20" width="5" height="14"/><rect x="66" y="24.5" width="14" height="5"/><rect x="70.5" y="20" width="5" height="14"/><rect x="20" y="70.5" width="14" height="5"/><rect x="24.5" y="66" width="5" height="14"/><rect x="66" y="70.5" width="14" height="5"/><rect x="70.5" y="66" width="5" height="14"/></g></symbol></svg>
<div class="app">
 <aside class="side">
  <div class="brand"><svg class="cruz"><use href="#cz"/></svg><span>Tradutor Bíblico</span></div>
  <button class="nav" id="bNovo"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Novo chat</button>
  <button class="nav" id="bBusca"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg>Procurar</button>
  <button class="nav" data-p="idiomas"><svg viewBox="0 0 24 24"><path d="M3 5h18M3 12h18M3 19h18"/></svg>Idiomas</button>
  <button class="nav" data-p="modelos"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h6v6H9z"/></svg>Modelos</button>
  <button class="nav" data-p="arquivos"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>Arquivos</button>
  <button class="nav" data-p="diario"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>Diário</button>
  <div class="scroll" id="lista"></div>
  <div class="rodape"><button class="nav" id="bConf"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>Configurações</button></div>
 </aside>
 <section class="main vazio" id="main">
  <div class="top"><span class="tt" id="tit"></span><span id="st" class="pill">verificando</span></div>
  <div class="stage">
   <div class="chat" id="chat"><div class="col" id="col"></div></div>
   <div class="box">
    <div class="ola"><svg class="cruz"><use href="#cz"/></svg>Como posso ajudar na tradução?</div>
    <div class="inp">
     <textarea id="t" rows="1" placeholder="Digite um comando, ajuda, ou texto em inglês para traduzir"></textarea>
     <div class="linha">
      <button class="modelo" id="bMod"><span id="modNome">Sem modelo</span><small>▾</small></button>
      <button class="send" id="bEnv">↑</button>
      <div class="pop" id="pop" style="display:none"></div>
     </div>
    </div>
    <div class="nota">Rascunhos de máquina. Todo texto precisa de validação por falantes nativos.</div>
   </div>
  </div>
  <div class="painel" id="painel"><div class="col" id="pcol"></div></div>
 </section>
</div>
<div class="veu" id="vBusca"><div class="cx"><input type="text" id="qBusca" placeholder="Procurar nas conversas"><div id="rBusca" style="margin-top:8px"></div></div></div>
<div class="veu" id="vConf"><div class="cx"><h2>Configurações</h2>
 <label>Endereço do motor local</label><input type="text" id="cApi" placeholder="http://127.0.0.1:8000">
 <label>Feixes de busca na tradução (mais feixes, mais qualidade e mais lento)</label><input type="number" id="cFeixes" min="1" max="8">
 <div style="margin-top:16px;text-align:right"><button class="btn" id="cSalvar">Salvar</button></div></div></div>
<script>
const $=s=>document.querySelector(s);
const LS={g:(k,d)=>{try{return localStorage.getItem(k)||d}catch(e){return d}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let API=LS.g("api",(location.hostname.endsWith("github.io")||location.protocol==="file:")?"http://127.0.0.1:8000":"");
let FEIXES=parseInt(LS.g("feixes","4")),MODELO=LS.g("modelo",""),CONV=null,ONLINE=false,MODELOS=[],LISTA=[],ocupado=false;
const main=$("#main"),col=$("#col"),chat=$("#chat"),t=$("#t");
async function api(p,o){const r=await fetch(API+p,o);if(!r.ok)throw new Error(r.status);return r.json()}
const post=(p,b,m)=>api(p,{method:m||"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
/* conexao */
async function ping(){try{await api("/api/status");ONLINE=true}catch(e){ONLINE=false}
 $("#st").textContent=ONLINE?"motor conectado":"motor desligado";$("#st").className="pill"+(ONLINE?" ok":"");
 if(ONLINE){await Promise.all([carregarLista(),carregarModelos()])}else{LISTA=[];try{MODELOS=(await (await fetch("modelos.json")).json()).map(m=>Object.assign({},m,{status:"em_teste",chrf:m.chrf_depois}))}catch(e){MODELOS=[]}renderLista();renderModelo()}}
/* lista de conversas */
async function carregarLista(){try{LISTA=await api("/api/conversas")}catch(e){LISTA=[]}renderLista()}
function renderLista(){
 const el=$("#lista");el.innerHTML="";
 if(!ONLINE){el.innerHTML='<div class="vazio-l">O motor está desligado. Na sua máquina rode python app.py para ver e salvar conversas.</div>';return}
 const sec=(nome,itens,chave)=>{
  if(!itens.length&&chave==="fix")return;
  const h=document.createElement("div");const fechado=LS.g("sec"+chave,"0")==="1";
  h.className="sec"+(fechado?" fechado":"");h.innerHTML="<span>"+nome+"</span><i>▼</i>";
  h.onclick=()=>{LS.s("sec"+chave,fechado?"0":"1");renderLista()};el.appendChild(h);
  if(fechado)return;
  if(!itens.length){el.insertAdjacentHTML("beforeend",'<div class="vazio-l">Nenhuma conversa ainda.</div>');return}
  itens.forEach(c=>{
   const d=document.createElement("div");d.className="conv"+(c.id===CONV?" on":"");
   d.innerHTML='<div class="t">'+esc(c.titulo)+'</div><button class="m">⋯</button>';
   d.querySelector(".t").onclick=()=>abrir(c.id);
   d.querySelector(".m").onclick=e=>{e.stopPropagation();menu(d,c)};
   el.appendChild(d)})};
 sec("Fixados",LISTA.filter(c=>c.fixada),"fix");sec("Recentes",LISTA.filter(c=>!c.fixada),"rec")}
function menu(d,c){document.querySelectorAll(".menu").forEach(m=>m.remove());
 const m=document.createElement("div");m.className="menu";
 m.innerHTML='<button data-a="f">'+(c.fixada?"Desafixar":"Fixar")+'</button><button data-a="r">Renomear</button><button data-a="x" class="r">Excluir</button>';
 m.onclick=async e=>{e.stopPropagation();const a=e.target.dataset.a;m.remove();
  if(a==="f"){await post("/api/conversas/"+c.id,{fixada:!c.fixada},"PATCH")}
  if(a==="r"){const n=prompt("Novo nome da conversa",c.titulo);if(n)await post("/api/conversas/"+c.id,{titulo:n},"PATCH")}
  if(a==="x"){if(confirm("Excluir esta conversa?")){await api("/api/conversas/"+c.id,{method:"DELETE"});if(CONV===c.id)novo()}}
  carregarLista()};
 d.appendChild(m)}
document.addEventListener("click",()=>{document.querySelectorAll(".menu").forEach(m=>m.remove());$("#pop").style.display="none"});
/* conversa */
function saiPainel(){main.classList.remove("pn");document.querySelectorAll(".nav.on").forEach(n=>n.classList.remove("on"))}
function novo(){saiPainel();CONV=null;col.innerHTML="";$("#tit").textContent="";main.classList.add("vazio");renderLista();t.focus()}
async function abrir(id){saiPainel();try{const c=await api("/api/conversas/"+id);CONV=id;col.innerHTML="";
 c.msgs.forEach(m=>add(m.papel==="user"?"u":"a",m.texto,m.arquivos));$("#tit").textContent=c.titulo;main.classList.remove("vazio");renderLista();chat.scrollTop=chat.scrollHeight}catch(e){novo()}}
function add(cls,txt,files){
 const d=document.createElement("div");d.className=cls;
 if(cls==="u"){const i=document.createElement("div");i.textContent=txt;d.appendChild(i)}
 else{d.textContent=txt;if(files&&files.length){const f=document.createElement("div");f.className="files";
  files.forEach(n=>{const a=document.createElement("a");a.href=API+"/api/arquivo/"+encodeURIComponent(n);a.textContent="⬇ "+n;f.appendChild(a)});d.appendChild(f)}}
 col.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
async function enviar(){
 const m=t.value.trim();if(!m||ocupado)return;
 if(!ONLINE){await ping();if(!ONLINE){main.classList.remove("vazio");add("u",m);add("a","O motor local não está rodando. Na sua máquina execute python app.py e recarregue esta página. Sem o motor eu não consigo treinar nem traduzir.");t.value="";return}}
 ocupado=true;$("#bEnv").disabled=true;t.value="";t.style.height="auto";
 try{
  if(!CONV){CONV=(await post("/api/conversas")).id}
  main.classList.remove("vazio");add("u",m);const p=add("a","Trabalhando nisso...");p.classList.add("pens");
  const r=await post("/api/chat",{conversa:CONV,msg:m,modelo:MODELO||null,feixes:FEIXES});
  p.remove();add("a",r.texto,r.arquivos);await carregarLista();await carregarModelos();
  const c=LISTA.find(x=>x.id===CONV);if(c)$("#tit").textContent=c.titulo
 }catch(e){const p=col.querySelector(".pens");if(p)p.remove();add("a","Falha ao falar com o motor.")}
 ocupado=false;$("#bEnv").disabled=false;t.focus()}
/* modelos */
async function carregarModelos(){try{MODELOS=await api("/api/modelos")}catch(e){MODELOS=[]}
 if(MODELO&&!MODELOS.find(m=>m.id===MODELO)){MODELO="";LS.s("modelo","")}renderModelo()}
function renderModelo(){const m=MODELOS.find(x=>x.id===MODELO);$("#modNome").textContent=m?m.nome:"Sem modelo"}
const ROT={aprovado:["aprovado","ap"],instalado:["instalado","in"],nao_treinado:["não instalado",""],em_teste:["em teste","te"]};
function pop(){const p=$("#pop");
 let h='<button class="op'+(MODELO===""?" sel":"")+'" data-id=""><b>Sem modelo</b><span>Só comandos. Texto livre não é traduzido.</span></button>';
 MODELOS.forEach(m=>{const ok=m.status!=="nao_treinado";const r=ROT[m.status];
  h+='<button class="op'+(ok?"":" off")+(MODELO===m.id?" sel":"")+'" data-id="'+m.id+'" data-ok="'+(ok?1:0)+'"><b>'+esc(m.nome)+'<em class="tag '+r[1]+'">'+r[0]+'</em></b><span>'+esc(m.descricao)+'</span><span>'+esc(m.base)+(m.chrf?" · chrF++ "+m.chrf.toFixed(1):"")+'</span></button>'});
 if(!MODELOS.length)h+='<div class="vazio-l">Nenhum modelo disponível. O motor está desligado.</div>';
 p.innerHTML=h;p.style.display="block";
 p.onclick=e=>{e.stopPropagation();const b=e.target.closest(".op");if(!b)return;
  if(b.dataset.ok==="0"){return}MODELO=b.dataset.id;LS.s("modelo",MODELO);renderModelo();p.style.display="none"}}
$("#bMod").onclick=e=>{e.stopPropagation();$("#pop").style.display==="block"?$("#pop").style.display="none":pop()};
/* paineis */
const byte=n=>n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";
async function painel(nome){
 document.querySelectorAll(".nav.on").forEach(n=>n.classList.remove("on"));
 document.querySelector('.nav[data-p="'+nome+'"]').classList.add("on");
 main.classList.add("pn");main.classList.remove("vazio");$("#tit").textContent="";
 const pc=$("#pcol");
 if(!ONLINE){pc.innerHTML='<h1>'+nome[0].toUpperCase()+nome.slice(1)+'</h1><div class="card">O motor está desligado. Rode python app.py na sua máquina.</div>';return}
 try{
 if(nome==="idiomas"){const d=await api("/api/idiomas");pc.innerHTML="<h1>Idiomas</h1>"+d.map(i=>'<div class="card"><b>'+esc(i.idioma)+'</b> <span>'+i.codigo+' · '+i.versiculos+' versículos no corpus</span><div class="acoes"><button class="btn" data-c="preparar '+i.idioma.split("-")[0].toLowerCase()+'">Preparar</button><button class="btn" data-c="treinar '+i.idioma.split("-")[0].toLowerCase()+'">Gerar caderno do Colab</button><button class="btn" data-c="importar modelo '+i.idioma.split("-")[0].toLowerCase()+'">Importar modelo</button><button class="btn" data-c="aprovar '+i.idioma.split("-")[0].toLowerCase()+'">'+(i.aprovado?"Aprovado":"Aprovar")+'</button></div></div>').join("")}
 if(nome==="modelos"){const d=ONLINE?await api("/api/modelos"):MODELOS;pc.innerHTML="<h1>Modelos</h1>"+d.map(m=>'<div class="card"><b>'+esc(m.nome)+'</b> <span>'+esc(m.base)+'</span><div style="margin-top:6px"><span>'+esc(m.descricao)+'</span></div><div style="margin-top:6px"><span>Estado '+ROT[m.status][0]+(m.chrf?' · chrF++ '+m.chrf.toFixed(1):'')+'</span></div><div class="acoes"><button class="btn" data-m="'+m.id+'"'+(m.status==="nao_treinado"||m.status==="em_teste"?" disabled":"")+'>Usar este modelo</button></div></div>').join("")}
 if(nome==="arquivos"){const d=await api("/api/arquivos");pc.innerHTML="<h1>Arquivos</h1>"+(d.length?d.map(a=>'<div class="lin"><a style="color:var(--txt)" href="'+API+'/api/arquivo/'+encodeURIComponent(a.nome)+'">'+esc(a.nome)+'</a><span>'+byte(a.tamanho)+' · '+new Date(a.quando*1000).toLocaleString("pt-BR")+'</span></div>').join(""):'<div class="card">Nada gerado ainda. Cadernos do Colab e rascunhos em PDF aparecem aqui.</div>')}
 if(nome==="diario"){const d=await api("/api/diario");pc.innerHTML="<h1>Diário</h1>"+(d.length?d.map(e=>{const {evento,quando,...r}=e;return '<div class="lin"><div><b>'+esc(evento)+'</b><br><span>'+esc(Object.entries(r).map(([k,v])=>k+" "+v).join(" · "))+'</span></div><span>'+new Date(quando).toLocaleString("pt-BR")+'</span></div>'}).join(""):'<div class="card">O diário está vazio.</div>')}
 }catch(e){pc.innerHTML='<div class="card">Não foi possível carregar.</div>'}}
$("#pcol").onclick=async e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.c){novo();t.value=b.dataset.c;enviar()}
 if(b.dataset.m){MODELO=b.dataset.m;LS.s("modelo",MODELO);renderModelo();novo()}};
document.querySelectorAll(".nav[data-p]").forEach(b=>b.onclick=e=>{e.stopPropagation();painel(b.dataset.p)});
/* busca e config */
$("#bBusca").onclick=e=>{e.stopPropagation();$("#vBusca").classList.add("on");$("#qBusca").value="";$("#rBusca").innerHTML="";$("#qBusca").focus()};
$("#vBusca").onclick=e=>{if(e.target.id==="vBusca")e.target.classList.remove("on")};
let tb;$("#qBusca").oninput=()=>{clearTimeout(tb);tb=setTimeout(async()=>{const q=$("#qBusca").value;if(!q.trim()||!ONLINE){$("#rBusca").innerHTML=ONLINE?"":'<div class="vazio-l">Motor desligado.</div>';return}
 const r=await api("/api/busca?q="+encodeURIComponent(q));
 $("#rBusca").innerHTML=r.length?r.map(x=>'<div class="res" data-id="'+x.id+'">'+esc(x.titulo)+'<span>'+esc(x.trecho)+'</span></div>').join(""):'<div class="vazio-l">Nada encontrado.</div>'},200)};
$("#rBusca").onclick=e=>{const r=e.target.closest(".res");if(r){$("#vBusca").classList.remove("on");abrir(r.dataset.id)}};
$("#bConf").onclick=e=>{e.stopPropagation();$("#cApi").value=API;$("#cFeixes").value=FEIXES;$("#vConf").classList.add("on")};
$("#vConf").onclick=e=>{if(e.target.id==="vConf")e.target.classList.remove("on")};
$("#cSalvar").onclick=()=>{API=$("#cApi").value.trim().replace(/\/$/,"");LS.s("api",API);FEIXES=Math.min(8,Math.max(1,parseInt($("#cFeixes").value)||4));LS.s("feixes",FEIXES);$("#vConf").classList.remove("on");ping()};
$("#bNovo").onclick=e=>{e.stopPropagation();novo()};
$("#bEnv").onclick=e=>{e.stopPropagation();enviar()};
t.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();enviar()}});
t.addEventListener("input",()=>{t.style.height="auto";t.style.height=t.scrollHeight+"px"});
document.querySelectorAll(".box,.cx").forEach(x=>x.addEventListener("click",e=>{if(!e.target.closest("#pop")&&!e.target.closest("#bMod"))$("#pop").style.display="none"}));
renderModelo();renderLista();ping();setInterval(ping,15000);
</script>
</body>
</html>
